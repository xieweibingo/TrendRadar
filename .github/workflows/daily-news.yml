name: Daily News Push to WeChat Work

on:
  schedule:
    # 每天中午12:00北京时间 (UTC+8 = 04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Update config with WeChat Work webhook
      env:
        WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
      run: |
        python scripts/update_config.py
    
    - name: Run TrendRadar
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
      run: |
        python -m trendradar
      timeout-minutes: 30
    
    - name: Upload output artifacts (optional)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trendradar-output
        path: output/
        retention-days: 7
